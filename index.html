<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{width:100%;height:100%;overflow:hidden;touch-action:none;}
body{width:100%;height:100%;background:#1a1a2e;display:flex;justify-content:center;align-items:center;font-family:'Press Start 2P',monospace;image-rendering:pixelated;overflow:hidden;position:fixed;top:0;left:0;}
#scale-wrap{width:360px;flex-shrink:0;transform-origin:center center;position:relative;}
#root{width:360px;position:relative;overflow:hidden;}
.screen{display:none;flex-direction:column;align-items:center;min-height:100vh;}
.screen.active{display:flex;}

/* HOME */
#home{background:#5c94fc;position:relative;overflow:hidden;min-height:100vh;}
.sky-layer{position:absolute;inset:0;background:#5c94fc;}
.title-wrap{position:relative;z-index:10;margin-top:48px;text-align:center;}
.title-line1{color:#fff;font-size:18px;display:block;text-shadow:3px 3px 0 #000;}
.title-line2{color:#f7c75a;font-size:13px;display:block;margin-top:6px;text-shadow:2px 2px 0 #7a5a00;}
.hero-panda{position:relative;z-index:10;width:130px;height:130px;margin-top:22px;animation:float 1.4s ease-in-out infinite;image-rendering:auto;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
.btn-play{background:#e83030;color:#fff;border:none;font-family:'Press Start 2P',monospace;font-size:13px;padding:16px 48px;cursor:pointer;box-shadow:0 6px 0 #8a0000,4px 4px 0 #000;text-shadow:1px 1px 0 #8a0000;letter-spacing:1px;position:relative;z-index:10;margin-top:28px;}
.btn-play:active{transform:translateY(4px);box-shadow:0 2px 0 #8a0000,4px 4px 0 #000;}
.hint-text{position:relative;z-index:10;margin-top:12px;font-size:7px;color:#fff;text-shadow:1px 1px 0 #000;animation:blink 1s step-end infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
.credits{position:relative;z-index:10;margin-bottom:90px;text-align:center;font-size:5px;color:rgba(255,255,255,0.5);text-shadow:1px 1px 0 rgba(0,0,0,0.5);line-height:2.2;}
.credits a{color:rgba(255,255,255,0.6);text-decoration:none;}
/* drawn ground strip — canvas element */
#home-ground{position:absolute;bottom:0;left:0;width:100%;height:80px;}

/* GAME */
#game-screen{padding:0;background:transparent;}
#canvas{display:block;cursor:pointer;}

/* GAME OVER */
#dead-overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,30,0.72);z-index:20;}

/* SUMMARY CARD */
#summary-card{
  width:300px;
  background:linear-gradient(160deg,#0d2248 0%,#1a3a6a 60%,#0d2248 100%);
  border:4px solid #f7c75a;
  box-shadow:0 0 0 2px #7a5a00, 6px 6px 0 #000;
  padding:0;
  overflow:hidden;
  position:relative;
}
/* stars decoration */
.card-stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.card-header{
  background:linear-gradient(90deg,#e83030,#c01010);
  padding:10px 16px;
  text-align:center;
  border-bottom:3px solid #f7c75a;
}
.card-header-title{font-size:12px;color:#fff;text-shadow:2px 2px 0 #7a0000;letter-spacing:2px;}
.card-body{padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.card-panda{width:56px;height:56px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.5));}
.card-score-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
.card-score-num{font-size:48px;color:#fff700;text-shadow:0 0 20px rgba(255,220,0,0.6),3px 3px 0 #7a5a00;line-height:1;}
.card-score-lbl{font-size:7px;color:rgba(255,255,255,0.5);letter-spacing:2px;}
.card-divider{width:80%;height:2px;background:linear-gradient(90deg,transparent,#f7c75a55,transparent);}
.card-footer{font-size:5px;color:rgba(255,255,255,0.35);letter-spacing:1px;padding-bottom:4px;}

/* BUTTONS */
.card-btns{display:flex;gap:10px;padding:0 16px 16px;width:100%;}
.btn-px{flex:1;font-family:'Press Start 2P',monospace;font-size:8px;padding:12px 6px;cursor:pointer;border:none;line-height:1.5;}
.btn-px.green{background:#5d8a3c;color:#fff;text-shadow:1px 1px 0 #000;box-shadow:0 4px 0 #2a5a10,3px 3px 0 #000;}
.btn-px.green:active{transform:translateY(3px);box-shadow:0 1px 0 #2a5a10,3px 3px 0 #000;}
.btn-px.xbtn{background:#000;color:#fff;text-shadow:none;box-shadow:0 4px 0 #444,3px 3px 0 #000;display:flex;align-items:center;justify-content:center;gap:5px;}
.btn-px.xbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #444,3px 3px 0 #000;}
.x-icon{width:13px;height:13px;flex-shrink:0;}
.btn-home-px{width:100%;background:transparent;color:rgba(255,255,255,0.45);border:none;font-family:'Press Start 2P',monospace;font-size:7px;cursor:pointer;padding:5px 0 10px;text-align:center;}
.btn-home-px:hover{color:#fff;}

#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#000;color:#fff;font-family:'Press Start 2P',monospace;font-size:8px;border:3px solid #f7c75a;padding:10px 18px;display:none;z-index:200;white-space:nowrap;}
</style>
</head>
<body>
<div id="scale-wrap">
<div id="root">

<!-- HOME -->
<div id="home" class="screen active">
  <div class="sky-layer"></div>
  <!-- pixel clouds -->
  <svg style="position:absolute;top:46px;left:18px;width:80px;height:32px;" viewBox="0 0 40 16">
    <rect x="4" y="9" width="32" height="7" fill="white" opacity=".9"/>
    <rect x="9" y="4" width="22" height="7" fill="white" opacity=".9"/>

<!-- GAME -->
<div id="game-screen" class="screen">

<script type="module">
// ---- SCALE ----
function applyScale(){
  const wrap=document.getElementById('scale-wrap');
  const vw=window.innerWidth;
  const vh=window.innerHeight;
  // fit game (360x640) into viewport — phone fills fully, desktop caps at 1.4x
  const scaleX=vw/360;
  const scaleY=vh/640;
  const scale=Math.min(scaleX,scaleY,1.4);
  wrap.style.transform=`scale(${scale})`;
  // compensate body height so page doesn't scroll on phone
  document.body.style.height=vh+'px';
  document.body.style.overflow='hidden';
}
applyScale(); window.addEventListener('resize',applyScale);

// ---- DRAW HOME GROUND (canvas, seamless pixel art) ----
function drawHomeGround(){
  const hgc=document.getElementById('home-ground');
  const hg=hgc.getContext('2d');
  const W=360,H=80;
  // sky-green grass top strip
  hg.fillStyle='#5db85d'; hg.fillRect(0,0,W,14);
  hg.fillStyle='#4a9a3a'; hg.fillRect(0,0,W,5);
  // lighter highlight
  hg.fillStyle='#70d070'; hg.fillRect(0,5,W,3);
  // small pixel grass tufts
  hg.fillStyle='#3a8a2a';
  for(let x=0;x<W;x+=18){ hg.fillRect(x,0,3,6); hg.fillRect(x+8,0,2,4); }
  // dirt
  hg.fillStyle='#c8955a'; hg.fillRect(0,14,W,H-14);
  // dirt horizontal lines
  hg.fillStyle='#b07a40';
  for(let y=20;y<H;y+=10) hg.fillRect(0,y,W,3);
  // dirt vertical segments (seams)
  hg.fillStyle='#a06830';
  for(let x=0;x<W;x+=40){
    const ox=(x%80<40)?x:x+20;
    hg.fillRect(ox,14,3,H-14);
  }
  // pebbles
  hg.fillStyle='#8a5828';
  const pebbles=[[20,30],[55,50],[90,25],[130,60],[170,35],[210,55],[250,28],[290,48],[330,38]];
  pebbles.forEach(([px,py])=>{hg.fillRect(px,py,5,3);});
}
drawHomeGround();

// ---- STAR PARTICLES on summary card ----
function spawnStars(score){
  const container=document.getElementById('card-stars');
  container.innerHTML='';
  const count=Math.min(5+score,18);
  for(let i=0;i<count;i++){
    const s=document.createElement('div');
    const size=Math.random()*3+1;
    s.style.cssText=`position:absolute;width:${size}px;height:${size}px;background:white;border-radius:50%;
      left:${Math.random()*100}%;top:${Math.random()*100}%;
      animation:twinkle ${0.8+Math.random()*1.2}s ease infinite alternate;opacity:${0.3+Math.random()*0.7}`;
    container.appendChild(s);
  }
  if(!document.getElementById('twinkle-kf')){
    const st=document.createElement('style');
    st.id='twinkle-kf';
    st.textContent='@keyframes twinkle{from{opacity:0.2;transform:scale(0.8);}to{opacity:1;transform:scale(1.4);}}';
    document.head.appendChild(st);
  }
}

// ---- FIREBASE ----
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const firebaseConfig={
  apiKey:"AIzaSyAKlOUePBw2Juvy5TU8myZHydfXl1vw15k",
  authDomain:"flappy-lunar.firebaseapp.com",
  databaseURL:"https://flappy-lunar-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"flappy-lunar",
  storageBucket:"flappy-lunar.firebasestorage.app",
  messagingSenderId:"280198539885",
  appId:"1:280198539885:web:18ce12cfde202675ddad64"
};
const fbApp=initializeApp(firebaseConfig);
const db=getDatabase(fbApp);
let fbConnected=false;
onValue(ref(db,'.info/connected'),snap=>{fbConnected=snap.val()===true;});

async function saveFB(sc){
  if(!fbConnected) return;
  try{
    // store anonymous sessions by timestamp
    const r=ref(db,'scores/'+Date.now());
    await set(r,{score:sc,ts:Date.now()});
  }catch(e){console.warn('FB:',e);}
}

// ---- IMAGES ----
const IMG_NORMAL=new Image(),IMG_FLAP=new Image(),IMG_FORK=new Image();
IMG_NORMAL.crossOrigin=IMG_FLAP.crossOrigin=IMG_FORK.crossOrigin='anonymous';
IMG_NORMAL.src='https://i.ibb.co/cSkV90ws/lunar-flappy-duck.png';
IMG_FLAP.src='https://i.ibb.co/tp6kpmyF/lunar-flappy-duck2.png';
IMG_FORK.src='https://i.ibb.co/20MwbzDx/Fork-yellow-big.png';

// ---- STATE ----
let gameState='idle',score=0,raf;
const W=360,H=560;
const TARGET_FPS=60;
const GRAVITY=0.34,FLAP_V=-6.8,PIPE_GAP=180,PIPE_W=64,PIPE_SPEED=2.4,PIPE_INTERVAL=95;
let bird,pipes,groundX,bgX,lastTs,nextPipe;

const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function initGame(){
  bird={x:80,y:H/2-20,vy:0,angle:0,flapping:false,flapTimer:0};
  pipes=[];groundX=0;bgX=0;score=0;lastTs=null;nextPipe=PIPE_INTERVAL;
  document.getElementById('dead-overlay').style.display='none';
}

function startGame(){gameState='playing';initGame();raf=requestAnimationFrame(loop);}

async function endGame(){
  gameState='dead';
  document.getElementById('d-score').textContent=score;
  document.getElementById('dead-overlay').style.display='flex';
  spawnStars(score);
  saveFB(score); // fire and forget — no leaderboard needed
}

function doFlap(){
  if(gameState==='playing'){bird.vy=FLAP_V;bird.flapping=true;bird.flapTimer=20;}
}

function spawnPipe(){
  const minY=90,maxY=H-90-PIPE_GAP-80;
  pipes.push({x:W+10,topH:Math.floor(Math.random()*(maxY-minY)+minY),passed:false});
}

// ---- PARALLAX LAYERS ----
// Layer speeds relative to PIPE_SPEED for depth illusion
// bg mountains: 0.12x  clouds-far: 0.22x  clouds-near: 0.45x  ground: 1x

function drawCloud(x,y,sc,alpha){
  ctx.globalAlpha=alpha;
  ctx.fillStyle='#ffffff';
  const b=[[0,4,10,5],[2,2,7,4],[4,0,5,4],[1,5,9,3]];
  b.forEach(([bx,by,bw,bh])=>ctx.fillRect(x+bx*sc,y+by*sc,bw*sc,bh*sc));
  ctx.globalAlpha=1;
}

function drawBg(){
  // sky gradient via two rects
  const grad=ctx.createLinearGradient(0,0,0,H-80);
  grad.addColorStop(0,'#3a78e0');
  grad.addColorStop(1,'#7ab8f5');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H-80);

  // far mountains / hills — slowest parallax (0.12x)
  const mx=((bgX*0.12)%(W+40));
  ctx.fillStyle='#5580c8';
  const hills=[[0,60,80],[60,45,90],[140,55,70],[200,40,100],[290,50,80],[360,58,70]];
  hills.forEach(([hx,hy,hw])=>{
    const ox=((hx-mx+W*4)%(W+200))-40;
    ctx.beginPath();
    ctx.moveTo(ox,H-80);
    ctx.quadraticCurveTo(ox+hw/2,H-80-hy,ox+hw,H-80);
    ctx.fill();
  });

  // far clouds — slow (0.22x)
  const fc=[[10,55,6],[130,38,5],[260,62,7],[380,44,5]];
  fc.forEach(([cx,cy,sc])=>{
    const ox=((cx - bgX*0.22 + W*4) % (W+120)) - 60;
    drawCloud(ox,cy,sc,0.55);
  });

  // near clouds — faster (0.45x)
  const nc=[[40,32,8],[180,22,6],[310,36,7],[440,28,5]];
  nc.forEach(([cx,cy,sc])=>{
    const ox=((cx - bgX*0.45 + W*4) % (W+140)) - 70;
    drawCloud(ox,cy,sc,0.88);
  });
}

// ---- CANVAS GROUND (parallax layers, seamless) ----
function drawGround(){
  const gh=80,gy=H-gh;

  // base grass
  ctx.fillStyle='#5db85d'; ctx.fillRect(0,gy,W,14);
  ctx.fillStyle='#4a9a3a'; ctx.fillRect(0,gy,W,5);
  ctx.fillStyle='#70d070'; ctx.fillRect(0,gy+5,W,3);

  // grass tufts — full pipe speed
  ctx.fillStyle='#3a8a2a';
  for(let i=0;i<20;i++){
    const ox=((i*22 - groundX + W*10) % (W+22));
    ctx.fillRect(ox,   gy,   3, 7);
    ctx.fillRect(ox+9, gy,   2, 5);
    ctx.fillRect(ox+15,gy,   3, 6);
  }

  // dirt base
  ctx.fillStyle='#c8955a'; ctx.fillRect(0,gy+14,W,gh-14);

  // dirt horizontal lines — static
  ctx.fillStyle='#b07a40';
  for(let y=gy+20;y<H;y+=12) ctx.fillRect(0,y,W,2);

  // mid-layer seams — 0.6x speed
  ctx.fillStyle='#a06830';
  for(let i=0;i<14;i++){
    const ox=((i*28 - groundX*0.6 + W*10) % (W+28));
    ctx.fillRect(ox, gy+14, 2, gh-14);
  }

  // pebbles — 0.8x speed  
  ctx.fillStyle='#8a5828';
  const pbs=[4,12,22,8,18,30,6,26,16,36,2,20,34,10,28];
  pbs.forEach((px,i)=>{
    const ox=((px*7 + i*18 - groundX*0.8 + W*10) % (W+10));
    ctx.fillRect(ox, gy+18+((i*7)%20), 5, 3);
  });
}

function drawFork(p){
  const fw=PIPE_W,cx=p.x+fw/2;
  if(IMG_FORK.complete&&IMG_FORK.naturalWidth>0){
    const scale=fw/IMG_FORK.naturalWidth;
    const fh=IMG_FORK.naturalHeight*scale;
    ctx.save(); ctx.translate(cx,p.topH); ctx.scale(1,-1);
    ctx.drawImage(IMG_FORK,-fw/2,0,fw,fh); ctx.restore();
    const ht=p.topH-fh;
    if(ht>0){
      ctx.fillStyle='#f5d020'; ctx.fillRect(cx-fw*0.28,0,fw*0.56,ht);
      ctx.fillStyle='#c8a800'; ctx.fillRect(cx-fw*0.28,0,fw*0.07,ht);
      ctx.fillStyle='#fff176'; ctx.fillRect(cx+fw*0.18,0,fw*0.07,ht);
    }
    const botY=p.topH+PIPE_GAP;
    ctx.drawImage(IMG_FORK,cx-fw/2,botY,fw,fh);
    const hb=botY+fh;
    if(hb<H-80){
      ctx.fillStyle='#f5d020'; ctx.fillRect(cx-fw*0.28,hb,fw*0.56,H-80-hb);
      ctx.fillStyle='#c8a800'; ctx.fillRect(cx-fw*0.28,hb,fw*0.07,H-80-hb);
      ctx.fillStyle='#fff176'; ctx.fillRect(cx+fw*0.18,hb,fw*0.07,H-80-hb);
    }
  } else {
    ctx.fillStyle='#f5d020';
    ctx.beginPath(); ctx.roundRect(cx-fw*0.28,0,fw*0.56,p.topH,[0,0,6,6]); ctx.fill();
    const botY=p.topH+PIPE_GAP;
    ctx.beginPath(); ctx.roundRect(cx-fw*0.28,botY,fw*0.56,H-80-botY,[6,6,0,0]); ctx.fill();
  }
}

function drawBird(){
  const img=(bird.flapping&&IMG_FLAP.complete&&IMG_FLAP.naturalWidth>0)?IMG_FLAP
           :(IMG_NORMAL.complete&&IMG_NORMAL.naturalWidth>0?IMG_NORMAL:null);
  if(!img) return;
  ctx.save();
  ctx.translate(bird.x,bird.y);
  ctx.rotate(Math.max(-0.45,Math.min(bird.angle,1.3)));
  ctx.drawImage(img,-32,-32,64,64);
  ctx.restore();
}

function drawScorePanel(){
  ctx.fillStyle='rgba(0,0,0,0.38)'; ctx.fillRect(W/2-40,10,80,36);
  ctx.fillStyle='#fff700'; ctx.font='20px "Press Start 2P"'; ctx.textAlign='center';
  ctx.fillText(score,W/2,36); ctx.textAlign='left';
}

function collides(p){
  const br=20,cO=9;
  if(bird.x+br<p.x-cO||bird.x-br>p.x+PIPE_W+cO) return false;
  if(bird.y-br<p.topH) return true;
  if(bird.y+br>p.topH+PIPE_GAP) return true;
  return false;
}

function loop(ts){
  if(!lastTs) lastTs=ts;
  const dt=Math.min((ts-lastTs)/1000*TARGET_FPS,3);
  lastTs=ts;
  ctx.clearRect(0,0,W,H); drawBg();
  if(gameState==='playing'){
    bgX+=PIPE_SPEED*dt; groundX+=PIPE_SPEED*dt;
    bird.vy+=GRAVITY*dt; bird.y+=bird.vy*dt;
    bird.angle=Math.max(-0.45,Math.min(bird.vy*0.075,1.3));
    if(bird.flapTimer>0){bird.flapTimer-=dt;}else{bird.flapping=false;}
    nextPipe-=dt;
    if(nextPipe<=0){spawnPipe();nextPipe=PIPE_INTERVAL;}
    for(let i=pipes.length-1;i>=0;i--){
      pipes[i].x-=PIPE_SPEED*dt;
      if(!pipes[i].passed&&pipes[i].x+PIPE_W<bird.x){pipes[i].passed=true;score++;}
      if(pipes[i].x+PIPE_W+10<0) pipes.splice(i,1);
    }
    const dead=bird.y+28>=H-80||bird.y-28<=0||pipes.some(p=>collides(p));
    if(dead){pipes.forEach(drawFork);drawGround();drawBird();endGame();cancelAnimationFrame(raf);return;}
  }
  pipes.forEach(drawFork); drawGround(); drawBird(); drawScorePanel();
  raf=requestAnimationFrame(loop);
}

// ---- SHARE ON X ----
async function doShareX(){
  const txt=`🌙 FLAPPY LUNAR\nI scored ${score} points! Can you beat me?\n@littlebaechu_ 🕹️`;
  try{
    const card=document.getElementById('summary-card');
    const {default:html2canvas}=await import('https://esm.sh/html2canvas@1.4.1');
    const cvs=await html2canvas(card,{scale:2,backgroundColor:null,useCORS:true});
    cvs.toBlob(async blob=>{
      const file=new File([blob],'flappy-lunar.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({title:'Flappy Lunar',text:txt,files:[file]});
      } else {
        window.open('https://x.com/intent/tweet?text='+encodeURIComponent(txt),'_blank');
      }
    },'image/png');
  }catch(e){
    window.open('https://x.com/intent/tweet?text='+encodeURIComponent(txt),'_blank');
  }
}

// ---- EVENTS ----
document.getElementById('btn-play').onclick=()=>{showScreen('game-screen');startGame();};
canvas.addEventListener('click',doFlap);
canvas.addEventListener('touchstart',e=>{e.preventDefault();doFlap();},{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();doFlap();}});
document.getElementById('btn-restart').onclick=()=>{document.getElementById('dead-overlay').style.display='none';startGame();};
document.getElementById('btn-share-x').onclick=doShareX;
document.getElementById('btn-home-from-dead').onclick=()=>{cancelAnimationFrame(raf);gameState='idle';showScreen('home');};
</script>
